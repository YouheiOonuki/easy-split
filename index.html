<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>easy-split | Simple &amp; Fair Bill Splitter</title>
  <meta name="description" content="A simple and fair bill-splitting tool with weighted calculation for group events.">
  <meta name="keywords" content="bill split, drinking party, group payment, weighted split,幹事,割り勘,清算">

  <!-- OGP -->
  <meta property="og:title" content="easy-split | Simple &amp; Fair Bill Splitter">
  <meta property="og:description" content="A simple and fair bill-splitting tool with weighted calculation for group events.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://youheioonuki.github.io/easy-split/">
  <meta property="og:image" content="https://youheioonuki.github.io/easy-split/icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icon.png" type="image/png">

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "easy-split",
    "description": "A simple and fair bill-splitting tool with weighted calculation for group events.",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "All",
    "url": "https://youheioonuki.github.io/easy-split/"
  }
  </script>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5375267956079717"
       crossorigin="anonymous"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <h1 class="app-title">easy-split</h1>
    <p class="app-subtitle">割り勘・傾斜清算アプリ</p>
    <div class="theme-switcher">
      <button class="theme-btn" data-theme="dark" title="Dark">🌙</button>
      <button class="theme-btn" data-theme="simple" title="Simple">☀️</button>
      <button class="theme-btn" data-theme="metal" title="Metal">⚙️</button>
    </div>
  </header>

  <main class="container">
    <!-- 会計（1次会・2次会…） -->
    <section class="card">
      <h2>💰 会計</h2>
      <div id="billTabs" class="bill-tabs"></div>
      <div id="billNameRow" class="bill-name-row hidden">
        <input type="text" id="billName" class="participant-name" aria-label="会計の名前" placeholder="会計の名前">
        <button id="removeBill" class="btn-remove" aria-label="この会計を削除">✕</button>
      </div>
      <div class="amount-input-group">
        <input type="number" id="totalAmount" inputmode="numeric" placeholder="合計金額を入力" min="0" step="100">
        <span class="currency">円</span>
      </div>
      <div class="amount-input-group sub">
        <label for="excludedAmount">割り勘対象外</label>
        <input type="number" id="excludedAmount" inputmode="numeric" placeholder="0" min="0" step="100" value="0">
        <span class="currency">円</span>
      </div>
      <div id="attendeeBox" class="hidden">
        <p class="field-hint">この会計に参加した人（タップで切り替え）</p>
        <div id="attendeeList" class="preset-row"></div>
      </div>
      <p id="billHint" class="field-hint">2次会がある場合は「＋ 会計を追加」。参加した人だけで割ります</p>
    </section>

    <!-- 参加者 -->
    <section class="card">
      <div class="card-head">
        <h2>👥 参加者</h2>
        <div class="stepper">
          <button id="removeLast" class="stepper-btn" aria-label="1人減らす">−</button>
          <span id="countLabel" class="stepper-count" aria-live="polite"></span>
          <button id="addParticipant" class="stepper-btn" aria-label="1人増やす">＋</button>
        </div>
      </div>
      <p class="field-hint">係数で傾斜をつけられます。「固定」で金額を直接指定（途中参加・幹事0円など）</p>
      <div id="participantsList"></div>
      <button id="addParticipantBottom" class="btn btn-add">＋ 参加者を追加</button>
    </section>

    <!-- 幹事 -->
    <section class="card">
      <h2>🎯 幹事</h2>
      <div class="organizer-select-group">
        <label for="organizerSelect">幹事</label>
        <select id="organizerSelect"></select>
      </div>
      <p class="field-hint">集金単位で割り切れない端数は幹事が調整します。幹事の持ち出しをゼロにするには、幹事の「固定」を 0円 にしてください</p>
    </section>

    <!-- 集金単位 -->
    <section class="card">
      <h2>🔢 集金単位</h2>
      <div class="unit-group" role="radiogroup" aria-label="集金単位">
        <label class="unit-option"><input type="radio" name="unit" value="auto" checked><span>自動</span></label>
        <label class="unit-option"><input type="radio" name="unit" value="1"><span>1円</span></label>
        <label class="unit-option"><input type="radio" name="unit" value="10"><span>10円</span></label>
        <label class="unit-option"><input type="radio" name="unit" value="100"><span>100円</span></label>
        <label class="unit-option"><input type="radio" name="unit" value="500"><span>500円</span></label>
        <label class="unit-option"><input type="radio" name="unit" value="1000"><span>1000円</span></label>
      </div>
      <p class="field-hint center" id="unitHint"></p>
    </section>

    <!-- 結果（入力に合わせて自動計算） -->
    <section id="resultSection" class="card">
      <h2>📊 計算結果</h2>
      <p id="formError" class="form-error hidden" role="alert"></p>
      <div id="resultBody">
        <div id="resultList"></div>
        <p id="resultNote" class="field-hint"></p>
        <div id="resultTotal" class="result-total"></div>
        <p id="collectSummary" class="collect-summary" aria-live="polite"></p>
        <button id="lineBtn" class="btn btn-line">LINEで送る</button>
        <div class="share-actions">
          <button id="shareBtn" class="btn btn-copy hidden">📤 共有</button>
          <button id="copyBtn" class="btn btn-copy">📋 コピー</button>
        </div>
        <p class="field-hint center">送った・コピーした結果は履歴に保存されます</p>
      </div>
    </section>

    <button id="resetBtn" class="btn btn-link">入力をリセット</button>

    <!-- 履歴 -->
    <section class="card">
      <h2>📋 履歴</h2>
      <div class="toggle-row">
        <label for="historyToggle">履歴を保存</label>
        <label class="toggle-switch">
          <input type="checkbox" id="historyToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div id="historyList"></div>
      <button id="clearHistory" class="btn btn-secondary hidden">履歴をクリア</button>
    </section>
  </main>

  <!-- AdSense -->
  <div class="ad-container">
    <!-- AD_PLACEHOLDER: Google AdSense code will be inserted here -->
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <nav class="footer-nav">
      <a href="about.html">About</a>
      <a href="terms.html">利用規約</a>
      <a href="privacy.html">プライバシーポリシー</a>
    </nav>
    <p class="footer-copy">&copy; 2026 easy-split by Youhei</p>
  </footer>

  <script src="split.js"></script>
  <script src="main.js"></script>
</body>
</html>
